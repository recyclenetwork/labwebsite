<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04180E"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Badge with Emerald Glow -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#10B981" stroke-width="8" stroke-opacity="0.35"/>
  <rect width="484" height="484" x="14" y="14" rx="114" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Flask Neck -->
  <path d="M 224 96 L 288 96 L 288 176 L 224 176 Z" fill="none" stroke="#34D399" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flask Lip -->
  <line x1="204" y1="96" x2="308" y2="96" stroke="#6EE7B7" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Flask Body (Conical Base) -->
  <path d="M 224 176 L 128 368 C 112 400 136 432 172 432 L 340 432 C 376 432 400 400 384 368 L 288 176 Z" 
        fill="none" 
        stroke="url(#flaskGrad)" 
        stroke-width="26" 
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Liquid inside Flask -->
  <path d="M 158 352 L 354 352 L 366 384 C 374 404 360 416 340 416 L 172 416 C 152 416 138 404 146 384 Z" 
        fill="#10B981" 
        fill-opacity="0.35"/>

  <!-- Bubbles in Liquid -->
  <circle cx="206" cy="384" r="12" fill="#6EE7B7" fill-opacity="0.85"/>
  <circle cx="258" cy="370" r="16" fill="#6EE7B7" fill-opacity="0.95"/>
  <circle cx="306" cy="388" r="10" fill="#6EE7B7" fill-opacity="0.75"/>

  <!-- Eco Leaf Sprout Emerging from Center -->
  <path d="M 256 250 C 256 250 216 280 220 326 C 256 326 286 296 286 296 C 286 296 316 326 352 326 C 356 280 316 250 316 250 C 316 250 286 230 256 250 Z" 
        fill="url(#leafGrad)" 
        filter="url(#glow)"/>

  <!-- Leaf Central Stem -->
  <path d="M 256 332 C 265 302 285 277 305 262" stroke="#042F1A" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
